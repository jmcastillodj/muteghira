name: Build MUTEGHIRA

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Logic tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev \
            libfontconfig1-dev libgl-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMUTEGHIRA_BUILD_TESTS=ON
      - name: Build tests
        run: cmake --build build --target MuteghiraTests --parallel
      - name: Run tests + UI snapshots
        run: xvfb-run -a build/MuteghiraTests_artefacts/Release/MuteghiraTests --snapshot snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: snapshots/*.png

  build:
    name: VST3 (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target MUTEGHIRA_VST3 --parallel

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - build/MUTEGHIRA_artefacts/Release/VST3/MUTEGHIRA.vst3

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          ditto -c -k --keepParent build/MUTEGHIRA_artefacts/Release/VST3/MUTEGHIRA.vst3 dist/MUTEGHIRA-macOS-VST3.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/MUTEGHIRA_artefacts/Release/VST3/MUTEGHIRA.vst3 -DestinationPath dist/MUTEGHIRA-Windows-VST3.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MUTEGHIRA-${{ matrix.name }}-VST3
          path: dist/*.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: MUTEGHIRA-*-VST3
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
